<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-label="Architektur des Stresstests: IOC, Brücke, Browser" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
