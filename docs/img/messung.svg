<text x="704.6666666666667" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">7</text>
<text x="755.3333333333333" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">9</text>
<text x="806.0" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">11</text>
<text x="856.6666666666667" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">13</text>
<text x="907.3333333333333" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">15</text>
<text x="730.0" y="390" font-size="11.5" fill="#6c757d" text-anchor="middle" font-weight="400">Sekunden seit Messbeginn</text>
<circle cx="690" cy="250" r="5" fill="#2b8a3e"/><text x="702" y="254" font-size="12" fill="#212529" text-anchor="start" font-weight="400">1 Hz: bleibt flach bei ca. 130 ms</text>
<circle cx="690" cy="272" r="5" fill="#c92a2a"/><text x="702" y="276" font-size="12" fill="#212529" text-anchor="start" font-weight="400">5 Hz: wächst um ca. 0,3 s je Sekunde</text>
<text x="30" y="424" font-size="12.5" fill="#6c757d" text-anchor="start" font-weight="400">Bei 10 Hz (10 000 Updates/s) staut sich die Brücke sofort: nach 15 s lag die Latenz bei p50 6,5 s und p95 über 11 s.</text>
</svg>
