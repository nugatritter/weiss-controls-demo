<polyline points="552.7,290.1 578.0,261.4 603.3,233.8 628.7,203.6 654.0,188.5 679.3,173.4 704.7,157.9 730.0,143.4 755.3,131.9 780.7,124.3" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linejoin="round"/><polyline points="552.7,339.0 578.0,340.8 603.3,339.9 628.7,336.2 654.0,336.6 679.3,340.3 704.7,339.3 730.0,338.8 755.3,338.4 780.7,339.3 806.0,339.0 831.3,338.7 856.7,340.5 882.0,337.6 907.3,335.4" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linejoin="round"/><text x="552.6666666666666" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">1</text>
<text x="603.3333333333334" y="370" font-size="11" fill="#6c757d" text-anchor="middle" font-weight="400">3</text>
