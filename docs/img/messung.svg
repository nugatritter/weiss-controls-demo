<line x1="80" y1="300.0" x2="420" y2="300.0" stroke="#e9ecef"/><text x="72" y="304.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">1000</text>
<line x1="80" y1="250.0" x2="420" y2="250.0" stroke="#e9ecef"/><text x="72" y="254.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">2000</text>
<line x1="80" y1="200.0" x2="420" y2="200.0" stroke="#e9ecef"/><text x="72" y="204.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">3000</text>
<line x1="80" y1="150.0" x2="420" y2="150.0" stroke="#e9ecef"/><text x="72" y="154.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">4000</text>
<line x1="80" y1="100.0" x2="420" y2="100.0" stroke="#e9ecef"/><text x="72" y="104.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">5000</text>
<rect x="110" y="300.0" width="36" height="50.0" rx="3" fill="#dee2e6"/><rect x="150" y="300.0" width="36" height="50.0" rx="3" fill="#2b8a3e"/><text x="148" y="370" font-size="12.5" fill="#212529" text-anchor="middle" font-weight="600">1 Hz</text>
<rect x="215" y="250.0" width="36" height="100.0" rx="3" fill="#dee2e6"/><rect x="255" y="250.15" width="36" height="99.85" rx="3" fill="#2b8a3e"/><text x="253" y="370" font-size="12.5" fill="#212529" text-anchor="middle" font-weight="600">2 Hz</text>
<rect x="320" y="100.0" width="36" height="250.0" rx="3" fill="#dee2e6"/><rect x="360" y="165.0" width="36" height="185.0" rx="3" fill="#c92a2a"/><text x="358" y="370" font-size="12.5" fill="#212529" text-anchor="middle" font-weight="600">5 Hz</text>
<text x="250.0" y="390" font-size="11.5" fill="#6c757d" text-anchor="middle" font-weight="400">grau = erwartet, farbig = empfangen (5 Hz: ca. 3600–3900)</text>
<text x="540" y="88" font-size="14" fill="#212529" text-anchor="start" font-weight="600">Latenz p50 je Sekunde [ms]</text>
<line x1="540" y1="350.0" x2="920" y2="350.0" stroke="#e9ecef"/><text x="532" y="354.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">0</text>
<line x1="540" y1="308.3333333333333" x2="920" y2="308.3333333333333" stroke="#e9ecef"/><text x="532" y="312.3333333333333" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">500</text>
<line x1="540" y1="266.6666666666667" x2="920" y2="266.6666666666667" stroke="#e9ecef"/><text x="532" y="270.6666666666667" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">1000</text>
<line x1="540" y1="225.0" x2="920" y2="225.0" stroke="#e9ecef"/><text x="532" y="229.0" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">1500</text>
<line x1="540" y1="183.33333333333334" x2="920" y2="183.33333333333334" stroke="#e9ecef"/><text x="532" y="187.33333333333334" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">2000</text>
<line x1="540" y1="141.66666666666666" x2="920" y2="141.66666666666666" stroke="#e9ecef"/><text x="532" y="145.66666666666666" font-size="11" fill="#6c757d" text-anchor="end" font-weight="400">2500</text>
