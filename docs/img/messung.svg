<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" width="960" height="445" role="img" aria-label="Messergebnisse: Durchsatz und Latenz je Update-Rate" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Messergebnisse: Durchsatz und Latenz je Update-Rate</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6c757d"/></marker></defs>
<rect width="960" height="445" rx="12" fill="#ffffff" stroke="#ced4da"/>
<text x="30" y="36" font-size="18" fill="#023e7d" text-anchor="start" font-weight="700">Messergebnisse (4 Kerne, ein Client)</text>
<text x="30" y="56" font-size="12.5" fill="#6c757d" text-anchor="start" font-weight="400">Gemessen mit scripts/check-ws-stress.py. Bei 5 Hz hält die Brücke nicht mehr Schritt.</text>
<text x="80" y="88" font-size="14" fill="#212529" text-anchor="start" font-weight="600">Empfangene Updates pro Sekunde</text>
